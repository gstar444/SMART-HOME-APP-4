name: Build APK

on:
  workflow_dispatch:        # GitHub -> Actions -> Build APK -> "Run workflow"
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Errors/warnings are shown in the log but do not stop the APK build.
      - run: flutter analyze
        continue-on-error: true
      - run: flutter test
        continue-on-error: true

      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: smart-home-apk
          path: build/app/outputs/flutter-apk/*.apk

  # Compiles the ESP32 firmware too and uploads the .bin (usable for OTA).
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core + libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install PubSubClient UniversalTelegramBot ArduinoJson SinricPro WebSockets NimBLE-Arduino "DHT sensor library" "Adafruit Unified Sensor"
      - name: Compile
        run: arduino-cli compile -b esp32:esp32:esp32:PartitionScheme=min_spiffs --export-binaries esp32_firmware/esp32_smart_home
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: esp32_firmware/esp32_smart_home/build/**/*.bin
